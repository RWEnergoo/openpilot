# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaButtonCancels
    widget: toggle
    title: Cruise Button Toggles Engagement (Alpha)
    description: Pressing the cruise/engage button while sunnypilot is engaged disengages it, making the button a full
      on/off toggle. Without this, the button press is overridden while sunnypilot longitudinal control is active.
      This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaButtonCancelHoldDuration
    widget: multiple_button
    title: Disengage Hold Duration
    description: How long to hold the right scroll wheel pressed to disengage. With the vehicle
      bus harness, only the right wheel can trigger this (scrolling, volume clicks and the left
      chill-mode hold are ignored) and Instant is safe. Without it, Instant acts as 0.5s and a
      long left-wheel hold also disengages.
    options:
    - value: 0
      label: Instant
      enablement:
      - type: capability
        field: tesla_has_vehicle_bus
        equals: true
    - value: 1
      label: 0.5s
    - value: 2
      label: 1s
    - value: 3
      label: 2s
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: TeslaButtonCancels
      equals: true
  - key: TeslaSoftBrakeAfterGas
    widget: toggle
    title: Soft Braking After Accelerator Override (Alpha)
    description: After releasing the accelerator during an override, braking ramps back in gently
      instead of snapping to the planned deceleration, similar to factory TACC behavior. Safety
      rules forbid braking while the accelerator is pressed, so the softening applies from the
      moment of release. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
  - key: TeslaSteerOverridePauses
    widget: toggle
    title: Steering Override Pauses Steering (Alpha)
    description: A hard steering override pauses lane centering instead of disengaging sunnypilot. Longitudinal control
      keeps running, like factory TACC. Steering automatically resumes after you release the wheel and the requested
      angle is close to your current angle. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaSteerOverrideResumeDelay
    widget: multiple_button
    title: Steering Resume Delay
    description: How long to wait after releasing a steering override before lane centering resumes.
      Steering only resumes once your grip is relaxed and the wheel is close to the requested angle,
      so 0.25s hands back control near-immediately.
    options:
    - value: 0
      label: 0.25s
    - value: 1
      label: 0.5s
    - value: 2
      label: 1s
    - value: 3
      label: 2s
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: TeslaSteerOverridePauses
      equals: true
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
